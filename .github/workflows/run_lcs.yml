name: Run LCS pipeline

on:
  workflow_dispatch:
    inputs:
      horizon_offset:
        description: Single horizon offset in days (leave blank to run configured horizons)
        required: false
        default: ''
        type: string
      timezone_preset:
        description: Optional timezone preset override key
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lcs-pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run configured horizons
        if: github.event_name == 'schedule' || github.event.inputs.horizon_offset == ''
        run: python scripts/run_scheduled_modes.py
      - name: Run one horizon
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.horizon_offset != ''
        run: |
          python scripts/run_pipeline.py --horizon-offset "${{ github.event.inputs.horizon_offset }}" ${{ github.event.inputs.timezone_preset != '' && format('--timezone-preset {0}', github.event.inputs.timezone_preset) || '' }}
          python scripts/build_pages.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcs-run
          path: |
            outputs/latest/
            docs/latest/
      - name: Commit latest outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/latest docs/latest config/aoi/current.geojson config/defaults.json
          git diff --cached --quiet || git commit -m "Update latest LCS outputs"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
